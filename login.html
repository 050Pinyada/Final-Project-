<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4chan Natural Scent - เข้าสู่ระบบ</title>
    <meta name="description" content="เข้าสู่ระบบบัญชี 4chan Natural Scent เพื่อจัดการคำสั่งซื้อและดูประวัติการสั่งซื้อ">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-container">
        <!-- Header -->
        <header>
            <a href="index.html" class="logo-container">
                <div class="logo-img">
                    <!-- Inline Clover SVG Logo -->
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path d="M50,50 C38,20 62,20 50,50 C20,38 20,62 50,50 C62,80 38,80 50,50 C80,62 80,38 50,50 Z"
                            fill="#2b8a3e" />
                        <path d="M50,50 Q48,70 38,85" stroke="#2b8a3e" stroke-width="5" stroke-linecap="round"
                            fill="none" />
                    </svg>
                </div>
            </a>
            <nav>
                <a href="index.html">หน้าแรก</a>
                <a href="about.html">เรื่องราวของเรา</a>
                <a href="products.html">ผลิตภัณฑ์</a>
                <a href="details.html">รายละเอียด</a>
                <a href="contact.html">ติดต่อ</a>
                <a href="login.html" class="active">เข้าสู่ระบบ</a>
            </nav>
            <!-- Hamburger Menu Button -->
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="เปิดเมนู">
                <span class="bar"><span class="dot"></span><span class="line"></span></span>
                <span class="bar"><span class="dot"></span><span class="line"></span></span>
                <span class="bar"><span class="dot"></span><span class="line"></span></span>
            </button>
        </header>

        <!-- Mobile Navigation Overlay -->
        <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
        <div class="mobile-nav-panel" id="mobileNavPanel">
            <button class="mobile-close-btn" id="mobileCloseBtn" aria-label="ปิดเมนู">✕</button>
            <a href="index.html">หน้าแรก</a>
            <a href="about.html">เรื่องราวของเรา</a>
            <a href="products.html">ผลิตภัณฑ์</a>
            <a href="details.html">รายละเอียด</a>
            <a href="contact.html">ติดต่อ</a>
            <a href="login.html" class="active">เข้าสู่ระบบ</a>
        </div>

        <!-- Main Content -->
        <main class="login-main">
            <!-- Login Form Container -->
            <div class="login-wrapper">
                <!-- Decorative Header -->
                <div class="login-header">
                    <div class="login-logo">
                        <svg viewBox="0 0 100 100" width="100%" height="100%">
                            <path d="M50,50 C38,20 62,20 50,50 C20,38 20,62 50,50 C62,80 38,80 50,50 C80,62 80,38 50,50 Z"
                                fill="#2b8a3e" />
                            <path d="M50,50 Q48,70 38,85" stroke="#2b8a3e" stroke-width="5" stroke-linecap="round"
                                fill="none" />
                        </svg>
                    </div>
                    <h1 class="login-title">เข้าสู่ระบบ</h1>
                    <p class="login-subtitle">ยินดีต้อนรับกลับ! กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
                </div>

                <!-- Login Form -->
                <form class="login-form" id="loginForm">
                    <div class="login-form-group">
                        <label class="login-label" for="loginUsername">
                            <span class="login-label-icon">👤</span>
                            ชื่อผู้ใช้ (Username)
                        </label>
                        <input type="text" class="login-input" id="loginUsername" name="username"
                            placeholder="กรอกชื่อผู้ใช้ของคุณ" required autocomplete="username">
                    </div>

                    <div class="login-form-group">
                        <label class="login-label" for="loginPassword">
                            <span class="login-label-icon">🔒</span>
                            รหัสผ่าน (Password)
                        </label>
                        <div class="login-password-wrapper">
                            <input type="password" class="login-input" id="loginPassword" name="password"
                                placeholder="กรอกรหัสผ่านของคุณ" required autocomplete="current-password">
                            <button type="button" class="login-toggle-password" id="togglePassword" aria-label="แสดง/ซ่อนรหัสผ่าน">
                                <span id="eyeIcon">👁️</span>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        🌿 เข้าสู่ระบบ
                    </button>
                </form>

                <!-- Decorative Footer -->
                <div class="login-footer-decoration">
                    <span class="login-ornament">🍃</span>
                    <span class="login-ornament-line"></span>
                    <span class="login-ornament-text">4chan Natural Scent</span>
                    <span class="login-ornament-line"></span>
                    <span class="login-ornament">🍃</span>
                </div>
            </div>
        </main>

    </div>

    <script src="app.js"></script>
</body>

</html>
